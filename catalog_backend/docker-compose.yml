services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: balance_catalog
      POSTGRES_USER: balance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - balance_catalog_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balance -d balance_catalog"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      BALANCE_DATABASE_URL: postgresql://balance:${POSTGRES_PASSWORD}@postgres/balance_catalog
      BALANCE_CATALOG_API_KEY: ${BALANCE_CATALOG_API_KEY:?set BALANCE_CATALOG_API_KEY}
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build: .
    command: ["uv", "run", "python", "scripts/migrate.py"]
    environment:
      BALANCE_DATABASE_URL: postgresql://balance:${POSTGRES_PASSWORD}@postgres/balance_catalog
    depends_on:
      postgres:
        condition: service_healthy

  sync:
    build: .
    command: ["uv", "run", "python", "-m", "scripts.sync_daemon"]
    restart: unless-stopped
    environment:
      BALANCE_DATABASE_URL: postgresql://balance:${POSTGRES_PASSWORD}@postgres/balance_catalog
      BALANCE_SYNC_POLL_SECONDS: ${BALANCE_SYNC_POLL_SECONDS:-21600}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  balance_catalog_data:
